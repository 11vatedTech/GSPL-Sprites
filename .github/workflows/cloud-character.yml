name: Cloud Character Production Test
on:
  push:
    branches: [experiment/cloud-character-production]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-character-production
  cancel-in-progress: true
jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout GSPL Sprites experiment
        uses: actions/checkout@v4
      - name: Checkout pinned Ara 3D Gen generator
        uses: actions/checkout@v4
        with:
          repository: olatunde85/3d-gen
          ref: 0f9f9c22973374dc67706344e1e9ddacb03bec87
          path: .cloud/ara3dgen
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .cloud/ara3dgen/package-lock.json
      - name: Install character generator dependencies
        working-directory: .cloud/ara3dgen
        run: npm ci
      - name: Download CC0 character data and build asset catalog
        working-directory: .cloud/ara3dgen
        run: npm run setup-assets
      - name: Generate high-detail Mosslight Warden
        working-directory: .cloud/ara3dgen
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          npm run export -- --params "$GITHUB_WORKSPACE/experiments/cloud-character/character.params.json" --formats glb --detail high --out "$GITHUB_WORKSPACE/dist"
          MODEL="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.glb' -print -quit)"
          test -n "$MODEL"
          cp "$MODEL" "$GITHUB_WORKSPACE/dist/MosslightWarden.glb"
      - name: Install headless Chromium and Playwright
        working-directory: .cloud/ara3dgen
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          ln -s "$GITHUB_WORKSPACE/.cloud/ara3dgen/node_modules" "$GITHUB_WORKSPACE/node_modules"
      - name: Run upstream GLB and animation regression suite
        working-directory: .cloud/ara3dgen
        run: |
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -u+x | head -n 1)"
          test -n "$CHROME"
          CHROME="$CHROME" npm run test:gltf
      - name: Assemble viewer and provenance
        run: |
          cp experiments/cloud-character/viewer/index.html dist/index.html
          cat > dist/ACKNOWLEDGEMENTS.md <<'EOF'
          # Asset and data acknowledgements
          Character generator: Ara 3D Gen, MIT License, https://github.com/olatunde85/3d-gen
          Character geometry, morph targets, skeleton, skins, hair and clothing: MakeHuman-derived CC0 1.0 assets, as documented upstream.
          Motion capture acknowledgement: "The data used in this project was obtained from mocap.cs.cmu.edu. The database was created with funding from NSF EIA-0196217."
          The character recipe and browser viewer are authored for this 11vatedTech experiment. Upstream meshes and motion performances are not claimed as original 11vatedTech assets.
          EOF
          cat > dist/BUILD-MANIFEST.json <<'EOF'
          {"character":"Mosslight Warden","generator":"Ara 3D Gen","generator_commit":"0f9f9c22973374dc67706344e1e9ddacb03bec87","detail":"high","format":"GLB","recipe":"experiments/cloud-character/character.params.json"}
          EOF
      - name: Start static viewer
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/cloud-character-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cloud-character-http.log
          exit 1
      - name: Verify generated character in Chromium
        run: node experiments/cloud-character/scripts/verify-viewer.mjs
      - name: Upload GLB, viewer, and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosslight-warden-cloud-build
          path: |
            dist/
            cloud-character-preview.png
            cloud-character-verification.json
          if-no-files-found: warn
          retention-days: 30
